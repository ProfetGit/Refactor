name: Check Retail addon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks python3
          make dev-setup
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: Refactor-retail
          path: .release/Refactor-retail.zip
